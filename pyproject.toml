[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arch-qube"
version = "0.1.1"
description = "AI-powered Architecture Quality Gate"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "jrjohn", email = "jr.johnchang@gmail.com"}]

dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "rich>=13.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
arch-qube = "arch_qube.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arch_qube = [
    "profiles/*.yaml",
    "rules/*.yaml",
    "rules/**/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
