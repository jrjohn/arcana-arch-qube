framework: react
platform: web
category: client

source_roots: ["src"]
file_extensions: [".ts", ".tsx"]

layers:
  - name: presentation
    paths: ["presentation/", "pages/", "components/"]
  - name: domain
    paths: ["domain/"]
  - name: data
    paths: ["data/"]
  - name: core
    paths: ["core/"]
    is_shared: true

allowed_dependencies:
  presentation: [domain, core]
  domain: [core]
  data: [domain, core]

import_pattern: "import .* from ['\"](.+?)['\"]"

di_container_files:
  - "**/core/di/**"
  - "**/core/providers/**"
  - "**/container.ts"
  - "**/serviceConfig.ts"

naming:
  viewmodel: "{name}.view-model.ts"
  repository: "{name}.repository.ts"
