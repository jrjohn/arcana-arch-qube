id: service-no-db
name: "Service Cannot Access DB Directly"
description: >
  Service must not write SQL, ORM queries, or direct DB operations.
  Must go through Repository interface.
category: backend
severity: critical
weight: 5
applies_to: [springboot, python, go, rust, nodejs]

ast_checks:
  - type: pattern_match
    check: "no_db_in_service"
    description: "Service files must not contain SQL or ORM query patterns"
    params:
      forbidden_patterns:
        - "@Query"
        - "nativeQuery"
        - "SELECT.*FROM"
        - "INSERT.*INTO"
        - "UPDATE.*SET"
        - "DELETE.*FROM"
        - ".query("
        - ".execute("
        - "createQueryBuilder"
        - "raw_sql"
        # Rust / Go (added 2026-10-02 — the list above is Java/TS-shaped and missed
        # `sqlx::query(...)` planted in arcana-cloud-rust). Deliberately exact: a bare
        # ".Query(" also matches Gin's c.Query("param"), and "query_as" matched redis
        # `.query_async(` in the service crate's cache.
        - "sqlx::query"
        - "diesel::"
        - "*sql.DB"
        - "*gorm.DB"
        - ".QueryContext("
        - ".ExecContext("
        - ".QueryRowContext("

scoring:
  method: percentage
  pass_threshold: 100
