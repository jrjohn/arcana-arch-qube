framework: ios
platform: mobile
category: client

source_roots: ["Sources", "*-ios/Sources"]
file_extensions: [".swift"]

layers:
  - name: presentation
    paths: ["Presentation/", "*Presentation/"]
  - name: domain
    paths: ["Domain/", "*Domain/"]
  - name: data
    paths: ["Data/", "*Data/"]
  - name: core
    paths: ["Core/", "*Core/"]
    is_shared: true

allowed_dependencies:
  presentation: [domain, core]
  domain: [core]
  data: [domain, core]

import_pattern: "import\\s+(\\w+)"

di_container_files:
  - "**/Dependencies.swift"
  - "**/DependencyValues+*.swift"
  - "**/ServiceModule.swift"

naming:
  viewmodel: "{Name}ViewModel.swift"
  service_impl: "{Name}ServiceImpl.swift"
  repository: "{Name}Repository.swift"
