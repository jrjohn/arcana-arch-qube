framework: android
platform: mobile
category: client

source_roots: ["app/src/main/java", "app/src/main/kotlin"]
file_extensions: [".kt", ".java"]

layers:
  - name: presentation
    paths: ["presentation/", "ui/"]
  - name: domain
    paths: ["domain/"]
  - name: data
    paths: ["data/"]
  - name: core
    paths: ["core/"]
    is_shared: true

allowed_dependencies:
  presentation: [domain, core]
  domain: [core]
  data: [domain, core]

import_pattern: "^import\\s+([a-zA-Z0-9_.]+)"

# Rule #3 (Only DI Container Imports Impl): ONLY the template's composition root. Every entry here
# is a place an Impl import is never reported, so a broad glob silently scores the rule 100
# (0.5.7: same defect as esp32 main/**, #27).
di_container_files:
  - "**/di/**"              # Hilt modules: com/example/arcana/di/*Module.kt
# wiring_files: skipped by the layer-direction / boundary / impl-location checks as before 0.5.7,
# but NOT by rule #3 -- an Impl import here is reported.
wiring_files:
  - "core/**"
  - "**/*Module.kt"
  - "**/hilt/**"
  - "data/worker/**"
  - "data/analytics/**"

naming:
  viewmodel: "{Name}ViewModel.kt"
  service_impl: "{Name}ServiceImpl.kt"
  repository: "{Name}Repository.kt"

# Domain-oriented feature modules (rule 22, module-boundary)
modules:
  roots: ["features/", "feature/", "screens/"]
  public: ["*Api.kt", "api/", "*Navigation.kt"]
