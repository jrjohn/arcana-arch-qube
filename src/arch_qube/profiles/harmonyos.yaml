framework: harmonyos
platform: mobile
category: client

source_roots: ["entry/src/main/ets"]
file_extensions: [".ets", ".ts"]

layers:
  - name: presentation
    paths: ["presentation/", "pages/", "components/"]
  - name: domain
    paths: ["domain/"]
  - name: data
    paths: ["data/"]
  - name: core
    paths: ["core/"]
    is_shared: true

allowed_dependencies:
  presentation: [domain, core]
  domain: [core]
  data: [domain, core]

import_pattern: "import .* from ['\"](.+?)['\"]"

# Rule #3 (Only DI Container Imports Impl): ONLY the template's composition root. Every entry here
# is a place an Impl import is never reported, so a broad glob silently scores the rule 100
# (0.5.7: same defect as esp32 main/**, #27).
di_container_files:
  - "core/di/**"            # AppContainer.ets, ContainerInitializer.ets, modules.ets
  - "**/DataMigration*"     # one-off migration wiring the RDB data source (named file, not a glob)
# wiring_files: skipped by the layer-direction / boundary / impl-location checks as before 0.5.7,
# but NOT by rule #3 -- an Impl import here is reported.
wiring_files:
  - "core/http/**"
  - "core/sync/**"
  - "data/repository/**"

naming:
  viewmodel: "{Name}ViewModel.ets"
