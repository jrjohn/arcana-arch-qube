framework: python
platform: backend
category: backend

source_roots: ["app", "src"]
file_extensions: [".py"]

layers:
  - name: controller
    paths: ["controller/", "controllers/", "routes/", "api/"]
  - name: service
    paths: ["service/", "services/"]
  - name: repository
    paths: ["repository/", "repositories/"]
  - name: dao
    paths: ["dao/", "datasource/"]
  - name: domain
    paths: ["domain/", "models/", "entities/"]
    is_shared: true
  - name: core
    paths: ["core/", "config/"]
    is_shared: true

allowed_dependencies:
  controller: [service, domain, core]
  service: [repository, domain, core]
  repository: [dao, domain, core]
  dao: [domain, core]

import_pattern: "^(?:from|import)\\s+([a-zA-Z0-9_.]+)"

# Rule #3 (Only DI Container Imports Impl): ONLY the template's composition root. Every entry here
# is a place an Impl import is never reported, so a broad glob silently scores the rule 100
# (0.5.7: same defect as esp32 main/**, #27).
di_container_files:
  - "**/di_container.py"
  - "**/container.py"
  - "**/dependencies.py"
  - "**/factory.py"                 # communication/factory.py picks the per-mode implementation
  - "**/impl/__init__.py"           # an impl package re-exporting its own classes
  # layered deployment: each layer process wires its own layer (services/, repositories/ servers)
  - "services/adapters/**"
  - "services/routes/**"
  - "repositories/routes/**"
# wiring_files: skipped by the layer-direction / boundary / impl-location checks as before 0.5.7,
# but NOT by rule #3 -- an Impl import here is reported.
wiring_files:
  - "**/adapters/**"
  - "**/tasks/**"
  - "**/decorators/**"
  - "**/routes/**"
  - "**/factory/**"
  - "**/__init__.py"

naming:
  service_impl: "{name}_service_impl.py"
  repository_impl: "{name}_repository_impl.py"
