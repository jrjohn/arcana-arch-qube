framework: rust
platform: backend
category: backend

source_roots: ["src", "crates"]
file_extensions: [".rs"]

layers:
  - name: controller
    paths: ["handler/", "api/", "routes/", "*-rest/", "*-grpc/"]
    is_shared: true
  - name: service
    paths: ["service/", "usecase/", "*-service/", "services/"]
    is_shared: true
  - name: repository
    paths: ["repository/", "repo/", "*-repository/"]
    is_shared: true
  - name: dao
    paths: ["dao/", "store/", "mysql/"]
    is_shared: true
  - name: domain
    paths: ["domain/", "entity/", "model/", "*-domain/"]
    is_shared: true
  - name: core
    paths: ["config/", "infra/", "*-core/"]
    is_shared: true

allowed_dependencies:
  controller: [service, domain, core]
  service: [repository, domain, core]
  repository: [dao, domain, core]
  dao: [domain, core]
  # Shared kernel: domain types may use core's result/id/entity primitives (arcana-core's own
  # domain/ module imports crate::ArcanaResult). Before import resolution worked this never fired.
  domain: [core]

import_pattern: "use\\s+(?:crate::)?([a-zA-Z0-9_:]+)"
# `use other_crate::x` → that workspace crate's directory, so imports are classified by the same
# layer paths as files. Without it (until 2026-11-17) every cross-crate import had target layer
# None: 1,543 edges in Desktop KM, and layer-direction / repository-no-service checked nothing.
import_resolver: rust_workspace

# Rule #3 (Only DI Container Imports Impl): ONLY the template's composition root. Every entry here
# is a place an Impl import is never reported, so a broad glob silently scores the rule 100
# (0.5.7: same defect as esp32 main/**, #27).
# lib.rs / mod.rs are not listed: `pub use r#impl::FooImpl;` re-exporting a child module is skipped
# by the import parser itself, and any other use of an Impl there is a real violation.
di_container_files:
  - "**/main.rs"
  - "**/container.rs"
  - "**/di.rs"
# wiring_files: skipped by the layer-direction / boundary / impl-location checks as before 0.5.7,
# but NOT by rule #3 -- an Impl import here is reported.
wiring_files:
  - "**/lib.rs"
  - "**/mod.rs"
