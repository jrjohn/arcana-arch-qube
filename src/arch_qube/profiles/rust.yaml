framework: rust
platform: backend
category: backend

source_roots: ["src", "crates"]
file_extensions: [".rs"]

layers:
  - name: controller
    paths: ["handler/", "api/", "routes/", "arcana-rest/", "arcana-grpc/"]
    is_shared: true
  - name: service
    paths: ["service/", "usecase/", "arcana-service/", "services/"]
    is_shared: true
  - name: repository
    paths: ["repository/", "repo/", "arcana-repository/"]
    is_shared: true
  - name: dao
    paths: ["dao/", "store/", "mysql/"]
    is_shared: true
  - name: domain
    paths: ["domain/", "entity/", "model/", "arcana-domain/"]
    is_shared: true
  - name: core
    paths: ["config/", "infra/", "arcana-core/"]
    is_shared: true

allowed_dependencies:
  controller: [service, domain, core]
  service: [repository, domain, core]
  repository: [dao, domain, core]
  dao: [domain, core]

import_pattern: "use\\s+(?:crate::)?([a-zA-Z0-9_:]+)"

di_container_files:
  - "**/main.rs"
  - "**/lib.rs"
  - "**/container.rs"
  - "**/mod.rs"
